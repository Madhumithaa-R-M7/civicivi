name: readyremake
description: "A civic reporting application for urban challenges."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  path: ^1.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  speech_to_text: ^7.3.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true